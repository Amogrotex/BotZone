name: Deploy BotZone to Cloudflare

on:
  push:
    branches:
      - arena/01a00a15-botzone
    paths:
      - "src/**"
      - "worker/**"
      - "admin/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: botzone-cloudflare-production
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Insert D1 database binding
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/g" worker/wrangler.jsonc

      - name: Type-check Worker
        run: npm run worker:check

      - name: Build same-origin storefront
        env:
          VITE_BACKEND: cloudflare
          VITE_BASE_PATH: /
        run: npm run build:cloudflare

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply botzone --remote --config worker/wrangler.jsonc

      - name: Deploy Worker, API, and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.jsonc
          secrets: |
            ADMIN_EMAIL
            ADMIN_PASSWORD_HASH
            SESSION_SECRET
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
