<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>مدیریت امن | بات‌زون</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("botzone_theme");
          const theme = saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
    <script type="module" crossorigin src="/BotZone/assets/main-D5lD-DXK.js"></script>
    <link rel="stylesheet" crossorigin href="/BotZone/assets/main-CINsV2Tc.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
