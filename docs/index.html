<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="description" content="بات‌زون؛ بازار تخصصی ربات‌ها، افزونه‌ها و آیتم‌های دیجیتال" />
    <title>بات‌زون | بازار ربات و آیتم‌های دیجیتال</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("botzone_theme");
          const theme = saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0c0d12" : "#f6f7fb";
        } catch (_) {}
      })();
    </script>
    <script type="module" crossorigin src="/BotZone/assets/main-CwJv3aqT.js"></script>
    <link rel="stylesheet" crossorigin href="/BotZone/assets/main-CINsV2Tc.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
