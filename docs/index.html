، شما موافقت خود را با تمامی قوانین و شرایط ذکر شده در این صفحه اعلام می‌کنید. در صورت عدم موافقت، لطفاً از استفاده خدمات خودداری کنید."},{heading:"استفاده مجاز",body:"ربات‌های ساخته شده روی پلتفرم بات‌زون باید مطابق با قوانین جمهوری اسلامی ایران و قوانین پیام‌رسان سروش باشند. هرگونه استفاده غیرقانونی، ارسال هرزنامه یا محتوای نامناسب ممنوع است."},{heading:"مسئولیت‌ها",body:"بات‌زون مسئولیتی در قبال محتوای تولید شده توسط ربات‌های کاربران ندارد. هر کاربر مسئول عملکرد و محتوای ربات خود می‌باشد."},{heading:"تعلیق حساب",body:"بات‌زون حق تعلیق یا حذف حساب‌هایی که قوانین استفاده را نقض کنند، بدون اطلاع قبلی محفوظ می‌دارد."}]},امنیت:{title:"سیاست امنیتی",sections:[{heading:"رمزنگاری داده‌ها",body:"تمامی ارتباطات بین کاربران و سرورهای بات‌زون با پروتکل TLS 1.3 رمزنگاری می‌شود. داده‌های حساس در حالت سکون نیز با الگوریتم AES-256 رمزنگاری شده‌اند."},{heading:"احراز هویت",body:"ما از سیستم احراز هویت چند مرحله‌ای (MFA) پشتیبانی می‌کنیم. توصیه اکید داریم که کاربران این قابلیت را فعال کنند تا امنیت حساب خود را افزایش دهند."},{heading:"نظارت و پایش",body:"سیستم‌های ما به‌صورت ۲۴ ساعته تحت نظارت هستند. هرگونه فعالیت مشکوک به‌سرعت شناسایی و بررسی می‌شود. لاگ‌های دسترسی به‌مدت ۹۰ روز نگهداری می‌شوند."},{heading:"گزارش آسیب‌پذیری",body:"اگر آسیب‌پذیری امنیتی در پلتفرم بات‌زون یافتید، لطفاً از طریق پشتیبانی (@Veltorix در سروش) به ما اطلاع دهید. ما برنامه پاداش باگ‌بانتی داریم."}]},کوکی‌ها:{title:"سیاست کوکی‌ها",sections:[{heading:"کوکی چیست؟",body:"کوکی‌ها فایل‌های متنی کوچکی هستند که در مرورگر شما ذخیره می‌شوند. ما از کوکی‌ها برای بهبود تجربه کاربری و عملکرد بهتر سایت استفاده می‌کنیم."},{heading:"کوکی‌های ضروری",body:"این کوکی‌ها برای عملکرد صحیح وب‌سایت الزامی هستند و شامل احراز هویت، تنظیمات جلسه و ترجیحات زبان می‌شوند. بدون این کوکی‌ها سایت به درستی کار نخواهد کرد."},{heading:"کوکی‌های تحلیلی",body:"ما از کوکی‌های تحلیلی برای درک نحوه استفاده کاربران از سایت استفاده می‌کنیم. این اطلاعات به ما کمک می‌کند تا خدمات خود را بهبود دهیم."},{heading:"مدیریت کوکی‌ها",body:"شما می‌توانید تنظی
